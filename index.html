<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRカメラ</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 24px;
    }

    #mode {
      font-size: 18px;
      margin: 15px 0;
      font-weight: bold;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      font-size: 18px;
      word-break: break-all;
    }

    button {
      font-size: 20px;
      padding: 14px 25px;
      border: none;
      border-radius: 10px;
      background: #333;
      color: white;
      margin: 10px;
    }
  </style>
</head>

<body>

<h1>📷 QRカメラ</h1>

<div id="mode"></div>

<button onclick="startCamera()">📷 カメラを起動</button>

<div id="reader"></div>

<div id="result">
  「カメラを起動」を押してください
</div>

<script>

let scanner = null;
let alreadyScanned = false;

const params = new URLSearchParams(window.location.search);
const mode = params.get("mode");

if (mode === "box") {
  document.getElementById("mode").innerText = "📦 箱QRを読み取ります";
} else if (mode === "product") {
  document.getElementById("mode").innerText = "📦 商品QRを読み取ります";
} else {
  document.getElementById("mode").innerText = "QRコードを読み取ります";
}

async function startCamera() {

  if (scanner !== null) {
    return;
  }

  alreadyScanned = false;

  document.getElementById("result").innerText =
    "📷 カメラを起動しています…";

  scanner = new Html5Qrcode("reader");

  try {

    await scanner.start(
      { facingMode: "environment" },

      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },

      onScanSuccess

    );

    document.getElementById("result").innerText =
      "QRコードをカメラに映してください";

  } catch (error) {

    console.error(error);

    document.getElementById("result").innerHTML =
      "❌ カメラを起動できませんでした<br><br>" +
      "Safariのカメラ許可を確認してください";

    scanner = null;
  }
}

async function onScanSuccess(decodedText) {

  if (alreadyScanned) {
    return;
  }

  alreadyScanned = true;

  document.getElementById("result").innerHTML =
    "✅ 読み取り成功<br><br>" + decodedText;

  if (scanner) {
    try {
      await scanner.stop();
    } catch (e) {
      console.log(e);
    }
  }

  if (window.opener) {

    window.opener.postMessage(
      {
        type: "QR_SCANNED",
        value: decodedText,
        mode: mode
      },
      "*"
    );

    document.getElementById("result").innerHTML +=
      "<br><br>✅ 前の画面へ読み取り結果を送りました";
      
  } else {

    document.getElementById("result").innerHTML +=
      "<br><br>⚠️ 前の画面が見つかりません";
  }
}

</script>

</body>
</html>
