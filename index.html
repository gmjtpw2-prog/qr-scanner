<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>QRカメラ</title>

<script
src="https://unpkg.com/html5-qrcode"
type="text/javascript">
</script>

<style>

body {
  font-family: sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px;
  background: #f5f5f5;
}

h1 {
  font-size: 24px;
}

#mode {
  font-size: 22px;
  font-weight: bold;
  margin: 20px 0;
}

#reader {
  width: 100%;
  max-width: 500px;
  margin: 20px auto;
  background: white;
  border-radius: 10px;
  overflow: hidden;
}

#result {
  margin-top: 20px;
  padding: 20px;
  background: white;
  border-radius: 10px;
  font-size: 20px;
  font-weight: bold;
  word-break: break-all;
}

button {
  font-size: 20px;
  padding: 14px 25px;
  border: none;
  border-radius: 10px;
  background: #333;
  color: white;
  margin: 10px;
}

#start {
  display: none;
}

.success {
  font-size: 26px;
  font-weight: bold;
}

.error {
  color: #d00;
}

</style>

</head>


<body>

<h1>📷 QRカメラ</h1>


<div id="mode">
  QRコードを読み取ります
</div>


<button
id="start"
onclick="startCamera(true)">

📷 カメラを起動

</button>


<div id="reader"></div>


<div id="result">

📷 カメラを起動しています…

</div>



<script>


/* =================================
   基本設定
================================= */

let scanner = null;

let scanning = false;

let alreadyScanned = false;

let productQR = "";

let audioContext = null;


const params =
new URLSearchParams(
  window.location.search
);


let mode =
params.get("mode") || "product";



/* =================================
   音の準備
================================= */

function prepareSound() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext) {
      return;
    }


    if (!audioContext) {

      audioContext =
        new AudioContext();

    }


    if (
      audioContext.state === "suspended"
    ) {

      audioContext.resume();

    }

  }

  catch (error) {

    console.log(error);

  }

}



/* =================================
   成功音
================================= */

function playSuccessSound() {

  try {

    prepareSound();


    if (!audioContext) {
      return;
    }


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.type =
      "sine";


    oscillator.frequency.value =
      1000;


    gain.gain.setValueAtTime(
      0.25,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.01,
      audioContext.currentTime + 0.2
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime + 0.2
    );

  }

  catch (error) {

    console.log(error);

  }

}



/* =================================
   モード表示
================================= */

function updateMode() {


  if (mode === "product") {

    document.getElementById("mode")
      .innerText =
      "② 商品QRを読み取ってください";

  }


  else if (mode === "box") {

    document.getElementById("mode")
      .innerText =
      "③ 📦 箱QRを読み取ってください";

  }


  else if (mode === "bulkBox") {

    document.getElementById("mode")
      .innerText =
      "📦 箱QRを読み取ってください";

  }


  else if (mode === "bulkProduct") {

    document.getElementById("mode")
      .innerText =
      "📷 商品QRを読み取ってください";

  }

}



/* =================================
   カメラ起動
================================= */

async function startCamera(userAction = false) {


  if (scanning) {
    return;
  }


  if (userAction) {

    prepareSound();

  }


  alreadyScanned = false;


  document.getElementById("result")
    .innerText =
    "📷 カメラを起動しています…";


  document.getElementById("start")
    .style.display =
    "none";


  scanner =
    new Html5Qrcode("reader");


  try {


    await scanner.start(

      {
        facingMode: "environment"
      },

      {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      },

      onScanSuccess

    );


    scanning = true;


    document.getElementById("result")
      .innerText =
      "QRコードをカメラに映してください";


  }


  catch (error) {


    console.error(error);


    scanner = null;


    document.getElementById("result")
      .innerHTML =

      "<div class='error'>" +

      "❌ カメラを自動起動できませんでした" +

      "</div>" +

      "<br>" +

      "下の「カメラを起動」を押してください";


    document.getElementById("start")
      .style.display =
      "inline-block";

  }

}



/* =================================
   QR読み取り成功
================================= */

function onScanSuccess(decodedText) {


  if (
    !scanning ||
    alreadyScanned
  ) {

    return;

  }


  alreadyScanned = true;



  /* =================================
     ① 1個入れ：商品
  ================================= */

  if (mode === "product") {


    productQR =
      decodedText;


    playSuccessSound();


    sendToParent(
      decodedText,
      "product"
    );


    document.getElementById("result")
      .innerHTML =

      "<div class='success'>" +

      "🟢 商品読み込み成功！" +

      "</div>" +

      "<br>" +

      "商品QR：" +

      "<br>" +

      decodedText +

      "<br><br>" +

      "📦 箱QRを読み取ってください";


    mode = "box";


    updateMode();


    setTimeout(

      function() {

        alreadyScanned = false;

        document.getElementById("result")
          .innerHTML =

          "<div class='success'>" +

          "🟢 商品読み込み成功！" +

          "</div>" +

          "<br><br>" +

          "📦 箱QRをカメラに映してください";

      },

      700

    );


    return;

  }



  /* =================================
     ② 1個入れ：箱
  ================================= */

  if (mode === "box") {


    const boxQR =
      decodedText;


    playSuccessSound();


    sendToParent(
      boxQR,
      "box"
    );


    document.getElementById("result")
      .innerHTML =

      "<div class='success'>" +

      "🟢 箱読み込み成功！" +

      "</div>" +

      "<br>" +

      "箱QR：" +

      "<br>" +

      boxQR +

      "<br><br>" +

      "💾 自動登録しています…";


    stopCamera();


    setTimeout(

      function() {


        productQR = "";


        mode = "product";


        updateMode();


        document.getElementById("result")
          .innerHTML =

          "🟢 登録完了！" +

          "<br><br>" +

          "次の商品QRを読み取ってください";


        document.getElementById("start")
          .style.display =
          "inline-block";


      },

      1500

    );


    return;

  }



  /* =================================
     ③ 一括入れ：箱
  ================================= */

  if (mode === "bulkBox") {


    playSuccessSound();


    sendToParent(
      decodedText,
      "bulkBox"
    );


    document.getElementById("result")
      .innerHTML =

      "<div class='success'>" +

      "🟢 箱読み込み成功！" +

      "</div>" +

      "<br>" +

      decodedText +

      "<br><br>" +

      "📷 商品QRを読み取ってください";


    stopCamera();


    setTimeout(

      function() {


        mode =
          "bulkProduct";


        updateMode();


        document.getElementById("result")
          .innerHTML =

          "🟢 箱読み込み成功！" +

          "<br><br>" +

          "📷 商品QRを読み取ってください";


        document.getElementById("start")
          .style.display =
          "inline-block";


      },

      800

    );


    return;

  }



  /* =================================
     ④ 一括入れ：商品
  ================================= */

  if (mode === "bulkProduct") {


    playSuccessSound();


    sendToParent(
      decodedText,
      "bulkProduct"
    );


    document.getElementById("result")
      .innerHTML =

      "<div class='success'>" +

      "🟢 商品読み込み成功！" +

      "</div>" +

      "<br>" +

      decodedText +

      "<br><br>" +

      "📷 次の商品QRを読み取ってください";


    /*
      一括入れでは
      カメラを停止しない

      そのまま次の商品を
      読み取れる
    */

    setTimeout(

      function() {

        alreadyScanned = false;


        document.getElementById("result")
          .innerHTML =

          "🟢 商品読み込み成功！" +

          "<br><br>" +

          "📷 次の商品QRを読み取ってください";

      },

      800

    );


    return;

  }

}



/* =================================
   Apps Scriptへ送信
================================= */

function sendToParent(
  value,
  scanMode
) {


  if (window.opener) {


    window.opener.postMessage(

      {

        type: "QR_SCANNED",

        value: value,

        mode: scanMode

      },

      "*"

    );

  }

}



/* =================================
   カメラ停止
================================= */

function stopCamera() {


  scanning = false;


  if (!scanner) {
    return;
  }


  scanner.stop()

    .then(

      function() {


        try {

          scanner.clear();

        }

        catch (e) {}


        scanner = null;

      }

    )

    .catch(

      function(error) {

        console.log(error);

        scanner = null;

      }

    );

}



/* =================================
   初期表示
================================= */

updateMode();


/*
  ページを開いたら
  自動的にカメラ起動を試す

  iPhone Safariが許可すれば
  ボタンを押す必要なし
*/

setTimeout(

  function() {

    startCamera(false);

  },

  300

);


</script>

</body>

</html>
