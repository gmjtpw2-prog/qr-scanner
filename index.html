<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRカメラ</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 24px;
    }

    #mode {
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      font-size: 18px;
      word-break: break-all;
    }

    button {
      font-size: 20px;
      padding: 14px 25px;
      border: none;
      border-radius: 10px;
      background: #333;
      color: white;
      margin: 10px;
    }

    #again {
      display: none;
    }
  </style>
</head>

<body>

<h1>📷 QRカメラ</h1>

<div id="mode"></div>

<button id="start" onclick="startCamera()">
  📷 カメラを起動
</button>

<div id="reader"></div>

<div id="result">
  「カメラを起動」を押してください
</div>

<button id="again" onclick="restartCamera()">
  📷 次のQRを読み取る
</button>

<script>

let scanner = null;
let scanning = false;

const params = new URLSearchParams(window.location.search);
let mode = params.get("mode");


/* 最初の表示 */

function updateMode() {

  if (mode === "box") {

    document.getElementById("mode").innerText =
      "📦 箱QRを読み取ります";

  } else {

    document.getElementById("mode").innerText =
      "📦 商品QRを読み取ります";

  }

}

updateMode();


/* カメラ開始 */

async function startCamera() {

  if (scanning) {
    return;
  }

  document.getElementById("again").style.display = "none";

  document.getElementById("result").innerText =
    "📷 カメラを起動しています…";

  scanner = new Html5Qrcode("reader");

  try {

    await scanner.start(

      { facingMode: "environment" },

      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },

      onScanSuccess

    );

    scanning = true;

    document.getElementById("result").innerText =
      "QRコードをカメラに映してください";

  } catch (error) {

    console.error(error);

    document.getElementById("result").innerHTML =
      "❌ カメラを起動できませんでした<br><br>" +
      "Safariのカメラ許可を確認してください";

    scanner = null;
  }

}


/* QR読み取り成功 */

async function onScanSuccess(decodedText) {

  if (!scanning) {
    return;
  }

  scanning = false;

  document.getElementById("result").innerHTML =
    "✅ 読み取り成功<br><br>" +
    decodedText;


  /* カメラ停止 */

  if (scanner) {

    try {
      await scanner.stop();
    } catch (e) {
      console.log(e);
    }

    try {
      scanner.clear();
    } catch (e) {
      console.log(e);
    }

    scanner = null;
  }


  /* 元のApps Script画面へ送る */

  if (window.opener) {

    window.opener.postMessage(

      {
        type: "QR_SCANNED",
        value: decodedText,
        mode: mode
      },

      "*"

    );

    document.getElementById("result").innerHTML +=
      "<br><br>✅ 読み取り結果を送りました";

  }


  /*
    箱QRを読んだ場合
    ↓
    自動的に商品QRモードへ変更
  */

  if (mode === "box") {

    mode = "product";

    updateMode();

    document.getElementById("result").innerHTML +=
      "<br><br>➡️ 商品QRを読み取る準備ができました";

    document.getElementById("again").style.display =
      "inline-block";

  } else {

    document.getElementById("again").style.display =
      "inline-block";

  }

}


/* 次のQR */

function restartCamera() {

  document.getElementById("reader").innerHTML = "";

  document.getElementById("result").innerText =
    "📷 カメラを起動してください";

  document.getElementById("again").style.display =
    "none";

  startCamera();

}

</script>

</body>
</html>
