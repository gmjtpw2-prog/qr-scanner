<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>QRカメラ</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 24px;
    }

    #mode {
      font-size: 22px;
      font-weight: bold;
      margin: 20px 0;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      word-break: break-all;
    }

    button {
      font-size: 20px;
      padding: 14px 25px;
      border: none;
      border-radius: 10px;
      background: #333;
      color: white;
      margin: 10px;
    }

    #start {
      display: inline-block;
    }

    .success {
      font-size: 26px;
      font-weight: bold;
    }

  </style>

</head>


<body>


<h1>📷 QRカメラ</h1>


<div id="mode">
  ② 商品QRを読み取ってください
</div>


<button
  id="start"
  onclick="startCamera()">

  📷 カメラを起動

</button>


<div id="reader"></div>


<div id="result">

  「カメラを起動」を押してください

</div>



<script>


/* =====================================
   基本設定
===================================== */

let scanner = null;

let scanning = false;

let alreadyScanned = false;

let productQR = "";


const params =
  new URLSearchParams(window.location.search);


let mode =
  params.get("mode") || "product";



/* =====================================
   音を鳴らす
===================================== */

function playSuccessSound() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const audioContext =
      new AudioContext();


    const oscillator =
      audioContext.createOscillator();

    const gainNode =
      audioContext.createGain();


    oscillator.connect(
      gainNode
    );

    gainNode.connect(
      audioContext.destination
    );


    oscillator.type =
      "sine";


    oscillator.frequency.value =
      1000;


    gainNode.gain.value =
      0.25;


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime + 0.15
    );


  } catch (error) {

    console.log(
      "音を鳴らせませんでした",
      error
    );

  }

}



/* =====================================
   画面表示
===================================== */

function updateMode() {


  if (mode === "product") {

    document.getElementById("mode")
      .innerText =
      "② 商品QRを読み取ってください";


  } else {

    document.getElementById("mode")
      .innerText =
      "③ 📦 箱QRを読み取ってください";

  }

}



/* =====================================
   カメラ起動
===================================== */

async function startCamera() {


  if (scanning) {

    return;

  }


  alreadyScanned = false;


  document.getElementById("result")
    .innerText =
    "📷 カメラを起動しています…";


  scanner =
    new Html5Qrcode("reader");


  try {


    await scanner.start(

      {
        facingMode: "environment"
      },

      {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      },

      onScanSuccess

    );


    scanning = true;


    document.getElementById("start")
      .style.display =
      "none";


    document.getElementById("result")
      .innerText =
      "QRコードをカメラに映してください";


  } catch (error) {


    console.error(error);


    document.getElementById("result")
      .innerHTML =

      "❌ カメラを起動できませんでした<br><br>" +

      "Safariのカメラ許可を確認してください";


    scanner = null;

  }

}



/* =====================================
   QR読み取り成功
===================================== */

function onScanSuccess(decodedText) {


  if (
    !scanning ||
    alreadyScanned
  ) {

    return;

  }


  alreadyScanned = true;



  /* =================================
     商品QR
  ================================= */

  if (mode === "product") {


    productQR =
      decodedText;


    /* -------------------------------
       成功音
    -------------------------------- */

    playSuccessSound();


    /* -------------------------------
       Apps Scriptへ商品QR送信
    -------------------------------- */

    if (window.opener) {

      window.opener.postMessage(

        {

          type: "QR_SCANNED",

          value: decodedText,

          mode: "product"

        },

        "*"

      );

    }


    /* -------------------------------
       画面表示
    -------------------------------- */

    document.getElementById("result")
      .innerHTML =

      "<div class='success'>" +

      "🟢 商品読み込み成功！" +

      "</div>" +

      "<br>" +

      "商品QR：" +

      "<br>" +

      decodedText +

      "<br><br>" +

      "⬇️" +

      "<br><br>" +

      "📦 箱QRを読み取ってください";


    /* -------------------------------
       箱QRモードへ変更
    -------------------------------- */

    mode = "box";


    updateMode();


    /* -------------------------------
       少し待って次のQRを受付
    -------------------------------- */

    setTimeout(

      function() {

        alreadyScanned = false;


        document.getElementById("result")
          .innerHTML =

          "<div class='success'>" +

          "🟢 商品読み込み成功！" +

          "</div>" +

          "<br>" +

          "📦 箱QRをカメラに映してください";

      },

      800

    );


    return;

  }



  /* =================================
     箱QR
  ================================= */

  if (mode === "box") {


    const boxQR =
      decodedText;


    /* -------------------------------
       成功音
    -------------------------------- */

    playSuccessSound();


    /* -------------------------------
       Apps Scriptへ箱QR送信
    -------------------------------- */

    if (window.opener) {

      window.opener.postMessage(

        {

          type: "QR_SCANNED",

          value: boxQR,

          mode: "box"

        },

        "*"

      );

    }


    /* -------------------------------
       画面表示
    -------------------------------- */

    document.getElementById("result")
      .innerHTML =

      "<div class='success'>" +

      "🟢 箱読み込み成功！" +

      "</div>" +

      "<br>" +

      "箱QR：" +

      "<br>" +

      boxQR +

      "<br><br>" +

      "💾 自動登録しています…";


    /* -------------------------------
       カメラ停止
    -------------------------------- */

    scanning = false;


    if (scanner) {


      scanner.stop()

        .then(

          function() {


            try {

              scanner.clear();

            } catch (e) {}


            scanner = null;


          }

        )

        .catch(

          function(error) {

            console.log(error);

            scanner = null;

          }

        );

    }



    /* -------------------------------
       次の商品へ
    -------------------------------- */

    setTimeout(

      function() {


        productQR = "";


        mode = "product";


        updateMode();


        document.getElementById("result")
          .innerHTML =

          "🟢 登録完了！" +

          "<br><br>" +

          "次の商品QRを読み取ってください";


        document.getElementById("start")
          .style.display =
          "inline-block";


      },

      1500

    );

  }

}



/* =====================================
   最初の表示
===================================== */

updateMode();


</script>


</body>

</html>
