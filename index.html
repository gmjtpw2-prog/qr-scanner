<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRカメラ</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 24px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      font-size: 18px;
      word-break: break-all;
    }

    button {
      font-size: 18px;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
    }
  </style>
</head>

<body>

<h1>📷 QRカメラ</h1>

<div id="reader"></div>

<div id="result">
  QRコードをカメラに映してください
</div>

<script>

let alreadyScanned = false;

function onScanSuccess(decodedText, decodedResult) {

  if (alreadyScanned) {
    return;
  }

  alreadyScanned = true;

  document.getElementById("result").innerHTML =
    "✅ 読み取り成功<br><br>" + decodedText;

  console.log("QR:", decodedText);
}

function onScanFailure(error) {
  // 読み取り中のエラーは無視
}

const scanner = new Html5QrcodeScanner(
  "reader",
  {
    fps: 10,
    qrbox: {
      width: 250,
      height: 250
    }
  },
  false
);

scanner.render(onScanSuccess, onScanFailure);

</script>

</body>
</html>
